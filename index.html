<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Tenable — Top 10 Football Trivia</title>
		<meta
			name="description"
			content="Top 10 football trivia — guess the answers to Top 10 lists across Premier League, Champions League, World Cup and more."
		/>
		<meta name="theme-color" content="#14181f" />

		<!-- Favicon/app icons — all derived from the Logo.tsx badge mark, see
		     public/favicon.svg's own header comment for how it stays in sync.
		     SVG first (what modern browsers actually use for the tab icon);
		     the PNGs are fallbacks for older browsers/other icon slots. -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />

		<!-- Open Graph / Twitter card — what a shared link previews as in
		     Slack, iMessage, X, Discord, etc. og-image.png is a static render
		     of this same header (badge + gradient wordmark), 1200x630 (the
		     standard "summary_large_image" card size). -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Tenable" />
		<meta property="og:title" content="Tenable — Top 10 Football Trivia" />
		<meta
			property="og:description"
			content="Guess the answers to Top 10 lists across Premier League, Champions League, World Cup and more."
		/>
		<meta property="og:url" content="https://tenable.cuong-luu.workers.dev" />
		<meta property="og:image" content="https://tenable.cuong-luu.workers.dev/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Tenable — Top 10 Football Trivia" />
		<meta
			name="twitter:description"
			content="Guess the answers to Top 10 lists across Premier League, Champions League, World Cup and more."
		/>
		<meta name="twitter:image" content="https://tenable.cuong-luu.workers.dev/og-image.png" />

		<!-- index.css names Inter as the primary font but nothing actually
		     loaded it before this, so every browser was silently falling back
		     to system-ui. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
	</head>

	<body>
		<div id="root"></div>
		<script type="module" src="/src/react-app/main.tsx"></script>
	</body>
</html>
