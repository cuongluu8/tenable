name: Sync seed and verify

# db/seed.sql is a checked-in export of production's content tables (see
# scripts/regen-seed.ts) -- it's what every "scratch local D1" step in
# CI (this workflow's own included, plus refresh-player-stats.yml and
# regenerate-derived-content.yml) is built from, and what a fresh
# `npm run db:local:reset` gives a developer locally. It goes stale the
# moment production content changes without it -- which is exactly what
# the other two workflows in this pipeline do. This workflow is the last
# link: it re-exports db/seed.sql from production and, only if the
# result actually still builds and passes verification, commits it.
#
# TRIGGER: runs once regenerate-derived-content.yml succeeds
# (workflow_run) -- the last step of the 3-workflow chain
# (refresh-player-stats.yml -> regenerate-derived-content.yml ->
# this) -- plus its own workflow_dispatch for an ad-hoc run (e.g. after
# a manual production content change made outside either of the other
# two workflows, such as the transfers backlog).
#
# SAFETY MODEL: unlike the other two workflows, there's no "local-first"
# option here -- the entire point is to pull the CURRENT state of
# production into db/seed.sql, so the export itself has to hit
# production. But nothing about that export can break the live app: it's
# a read-only `wrangler d1 export`, never a write. The safeguard here is
# on the OUTPUT side instead: the freshly exported seed.sql is applied to
# a completely clean local D1 (schema.sql + the new seed.sql, nothing
# else) and run through the full verify suite before it's ever committed.
# If anything fails, the job fails and db/seed.sql in the repo is left
# exactly as it was -- a stale-but-known-good seed is strictly better than
# a fresh-but-broken one, and the failed run itself is the alert a human
# needs to look at production directly.
#
# Requires the same CLOUDFLARE_API_TOKEN (Account.D1:Edit scope; read-only
# access would also be enough for this workflow specifically, but keeping
# one token shared across all three workflows is simpler than managing
# scoped ones per workflow) and possibly CLOUDFLARE_ACCOUNT_ID repository
# secrets as the other two workflows -- until those exist this workflow
# fails cleanly at the export step.
on:
  workflow_run:
    workflows: ["Regenerate derived content"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Re-export db/seed.sql from production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:seed:regen

      - name: Reset local D1 from schema.sql + the freshly exported seed.sql
        run: npm run db:local:reset

      - name: Verify the freshly exported seed still builds a working app
        run: |
          npm run verify:matching
          npm run verify:query-plans
          npm run build

      - name: Commit db/seed.sql if it changed
        run: |
          if git diff --quiet -- db/seed.sql; then
            echo "db/seed.sql is already up to date with production -- nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db/seed.sql
          git commit \
            -m "Sync db/seed.sql with production content" \
            -m "Auto-generated by .github/workflows/sync-seed-and-verify.yml -- verified against a clean local D1 reset + the full verify suite before commit."
          git push
