name: CI

# Runs on every push and pull request against main — the actual automated
# gate requested after two guess-matching bugs shipped to production before
# anyone asked for one. This is not advisory: a red check here is meant to
# be a real signal, not a script someone has to remember to run by hand.
#
# The playtest job drives the real HTTP API (via `wrangler dev`, local D1 +
# KV, no Cloudflare credentials needed — `--local` mode never talks to the
# real account) through every category the way an actual player would,
# deliberately using obscure aliases, mixed case, and punctuation swapped
# between space/hyphen to try to break guess matching. verify-name-sync
# catches a related but different bug class: an answer whose canonical name
# has drifted from the same real person/club's reference_entities row (e.g.
# "Thiago" vs. the real "Igor Thiago"), which can both silently reject a
# correctly-spelled guess and make one entity look like two in typeahead.
# None of the three checks below can tell a category's *numbers* are simply
# wrong against the real world (pl-2025-26-final-table shipped with the
# wrong 9th/10th place for a while — a user caught it, not this suite,
# because nothing here checks real-world correctness at all; a follow-up
# attempt at a fix — a marker comment claiming a category had been
# checked, enforced on every push — was rightly rejected: it didn't verify
# anything, and ran regardless of whether content had even changed). The
# actual fact-check against a live sports-data API lives in
# scripts/verify-content-source.ts, run by content-check.yml, which
# triggers only when db/seed.sql changes — not here. See
# scripts/playtest.ts, scripts/verify-guess-matching.ts, and
# scripts/verify-name-sync.ts for what each check below actually asserts,
# and agents.md for how to run all four (three here, one in the other
# workflow) locally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # A real hang should fail loudly within a bounded window rather than run
    # until GitHub's default 6-hour job timeout. Not a response to an actual
    # hang, to be clear — the full suite reliably completes in ~2.5-4
    # minutes (see scripts/playtest.ts's startDevServer for a note on a
    # false alarm here: this workflow's early runs *looked* stuck via
    # list_workflow_jobs' per-step status, which lagged well behind actual
    # completion, and got cancelled for nothing) — just defense in depth
    # against a genuine future hang.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - name: Seed local D1
        run: |
          npx wrangler d1 execute tenable-content --local --file=db/schema.sql
          npx wrangler d1 execute tenable-content --local --file=db/seed.sql

      - name: Verify guess-matching correctness (all answers/aliases)
        run: npm run verify:matching

      - name: Verify answer names stay in sync with the reference pool
        run: npm run verify:name-sync

      - name: Playtest every category end to end
        run: npm run playtest
