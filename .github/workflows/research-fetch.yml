name: Research fetch

# One-off, manually-triggered tool: the dev sandbox this repo is normally
# worked on from has no route to any external host (its egress proxy
# blocks everything, and WebSearch only returns fragmentary result
# snippets, not full page content -- not precise enough to read a stats
# table off). GitHub Actions runners have ordinary internet access, so
# this fetches a small list of URLs and prints their content into the job
# log, which the agent then reads back via the API to do its own sourcing/
# cross-referencing exactly as it would from a WebFetch result. Never
# touches app code or data itself -- purely a research aid. Safe to leave
# in place; only ever runs when someone dispatches it by hand.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Newline-separated URLs to fetch"
        required: true
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch each URL and print its content
        run: |
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            echo "===== FETCH: $url ====="
            curl -sL --max-time 20 -A "Mozilla/5.0 (research fetch)" "$url" | head -c 60000
            echo ""
            echo "===== END: $url ====="
          done <<< "${{ inputs.urls }}"
